<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Business Performance &amp; Revenue Analytics</title>
<style>
:root{--bg:#f4f6fb;--cd:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e5e9f2;--pr:#2563eb;--g:#16a34a;--r:#dc2626;--o:#f59e0b;--p:#7c3aed;--cy:#0891b2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1220;--cd:#131c2e;--tx:#e8edf7;--mu:#93a1b8;--bd:#25314a;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0b1220;--cd:#131c2e;--tx:#e8edf7;--mu:#93a1b8;--bd:#25314a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
h1{margin:0;font-size:24px;color:var(--pr)}h2{font-size:18px;margin:26px 0 10px}h3{margin:0 0 10px;font-size:14px}
.sub{color:var(--mu);margin:2px 0 0}.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg button,.bar input,.bar select{border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:7px 12px;font:inherit;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.k{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;min-width:0}
.kp .l{color:var(--mu);font-size:12px}.kp .v{font-size:24px;font-weight:700;margin:4px 0}.kp .d{font-size:11px;color:var(--mu)}
.up{color:var(--g);font-weight:600}.dn{color:var(--r);font-weight:600}
svg{width:100%;height:auto;display:block}.lgd{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:6px}
i.s{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mu);font-weight:500;text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}td{padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
tr.cl{cursor:pointer}tr.cl:hover{background:var(--bg)}
.h{display:grid;grid-template-columns:120px 1fr auto;gap:8px;align-items:center;margin:7px 0;font-size:12px}.h .t{background:var(--bd);border-radius:5px;height:10px;overflow:hidden}.h .t b{display:block;height:100%;border-radius:5px}
.dnw{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.dnw svg{width:130px}.lg{display:flex;gap:6px;align-items:center;font-size:12px;margin:3px 0}.lg b{margin-left:auto;padding-left:14px}
.tag{padding:2px 8px;border-radius:10px;font-size:11px;background:var(--bg)}
.big{font-size:28px;font-weight:700}.pill{border-radius:10px;padding:12px;margin-bottom:10px}
.mo{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}.mo.on{display:flex}.mb{background:var(--cd);border-radius:14px;max-width:820px;width:100%;padding:18px}
.x{float:right;cursor:pointer;border:0;background:var(--bg);color:var(--tx);border-radius:8px;padding:4px 10px}
</style></head><body>
<div class="top"><div><h1>Business Performance &amp; Revenue Analytics</h1><p class="sub">Track leads, conversions, quotations, deals, revenue and operations in real time. <span id="cmp"></span></p></div>
<div class="bar"><span class="seg" id="seg"></span><span id="cu" style="display:none"><input type="date" id="f"> <input type="date" id="t"></span></div></div>
<h2>Lead Analytics</h2><div class="g k" id="kpi"></div><div class="g" style="margin-top:14px" id="lead"></div>
<h2>Quotation Analytics</h2><div class="g" id="quo"></div>
<h2>Deals &amp; Revenue</h2><div class="g" id="dea"></div>
<h2>Orders &amp; Payments</h2><div class="g" id="ord"></div>
<h2>Lead Explorer &mdash; lead-wise history (click a row to drill down)</h2>
<div class="c"><div class="bar" style="margin-bottom:8px"><input id="q" placeholder="Search lead / ID"><select id="ss"><option value="">All status</option><option>Converted</option><option>Qualified</option><option>Unqualified</option></select></div><div class="w" id="lx"></div></div>
<div class="mo" id="mo"><div class="mb"><button class="x" onclick="mo.classList.remove('on')">Close</button><div id="mc"></div></div></div>
<script>
// ---------- dummy data (seeded) ----------
let s=42;const R=()=>(s=(s*16807)%2147483647)/2147483647,pick=a=>a[Math.floor(R()*a.length)];
const D=864e5,T0=Date.UTC(2026,9,18),day=o=>new Date(T0-o*D).toISOString().slice(0,10),dd=o=>day(Math.max(0,o)),ms=x=>Date.parse(x);
const SV=['Private Limited','LLP','GST','Trademark','FSSAI','Annual Compliance','ISO Certification'];
const CAT={'Private Limited':'Registration','LLP':'Registration','GST':'Tax & Compliance','Annual Compliance':'Tax & Compliance','Trademark':'Intellectual Property','FSSAI':'Licenses','ISO Certification':'Licenses'};
const L=[],Q=[],Dl=[],O=[],P=[];
for(let i=1;i<=340;i++){const off=Math.floor(R()*80),r=R(),st=r<.25?'Converted':r<.47?'Qualified':'Unqualified',x=R();
 const l={id:'L-'+(209000+i),name:pick(['Apex','Nova','Zenith','Orbit','Bluepeak','Kiran','Vertex','Lotus','Mehta'])+' '+pick(['Traders','Foods','Tech','Exports','Studio']),date:dd(off),src:x<.7?'Google Ads':x<.9?'Website':x<.96?'Just Dial':'Other',st,own:pick(['Nancy Singh','Sneha Choudhary','Tannu Kumari'])};L.push(l);
 if(st==='Unqualified'&&R()<.8)continue;const n=1+Math.floor(R()*3);let acc=false;
 for(let k=0;k<n;k++){const q={id:'Q-'+(10000+Q.length),lead:l.id,date:dd(off-k*2),svc:pick(SV),amt:(4+Math.floor(R()*55))*1000,st:'Pending'};
  if(st==='Converted'&&!acc&&(k===n-1||R()<.6)){q.st='Accepted';acc=true}else if(R()<.15)q.st='Rejected';Q.push(q);
  if(q.st!=='Accepted')continue;
  const d={id:'D-'+(800+Dl.length),lead:l.id,q:q.id,date:q.date,svc:q.svc,val:q.amt,pri:pick(['High','High','Medium','Medium','Low']),stage:pick(['Docs Pending','Processing','Filing','Completed']),col:0};Dl.push(d);
  for(let j=0,no=1+Math.floor(R()*2);j<no;j++){const t=pick(['Pending','In Progress','Completed','On Hold']);O.push({id:'O-'+(2100+O.length),deal:d.id,date:q.date,svc:d.svc,st:t,pg:t==='Completed'?100:t==='Pending'?0:20+Math.floor(R()*70)})}
  const np=1+Math.floor(R()*3);let rem=Math.round(d.val*(.3+R()*.7));
  for(let j=0;j<np&&rem>0;j++){const a=j===np-1?rem:Math.round(rem*(.3+R()*.4));rem-=a;d.col+=a;P.push({id:'P-'+(1000+P.length),deal:d.id,date:dd(off-j*3),amt:a,mode:pick(['UPI','Bank Transfer','Card'])})}}}
// ---------- helpers ----------
const $=id=>document.getElementById(id),sum=(a,k)=>a.reduce((t,x)=>t+x[k],0),inr=v=>'₹'+Math.round(v).toLocaleString('en-IN'),fk=v=>v>=1e5?(v/1e5).toFixed(1)+'L':v>=1e3?(v/1e3).toFixed(0)+'K':Math.round(v);
const inR=(d,a,b)=>d>=a&&d<=b,gb=(a,f)=>a.reduce((m,x)=>((m[f(x)]=m[f(x)]||[]).push(x),m),{});
const S={k:'30',from:day(29),to:day(0)};
function rg(){let to=day(0),from;if(S.k==='today')from=to;else if(S.k==='7')from=day(6);else if(S.k==='30')from=day(29);else{from=S.from;to=S.to}
 if(from>to)[from,to]=[to,from];const len=(ms(to)-ms(from))/D+1,z=m=>new Date(m).toISOString().slice(0,10);return{from,to,pf:z(ms(from)-len*D),pt:z(ms(from)-D),len}}
const dates=(a,b)=>{const r=[];for(let m=ms(a);m<=ms(b);m+=D)r.push(new Date(m).toISOString().slice(0,10));return r};
function M(a,b){const f=(A)=>A.filter(x=>inR(x.date,a,b)),l=f(L),q=f(Q),d=f(Dl),o=f(O),p=f(P),qual=l.filter(x=>x.st!=='Unqualified').length,conv=l.filter(x=>x.st==='Converted').length;
 return{l,q,d,o,p,n:l.length,qual,conv,unq:l.length-qual,cr:l.length?conv/l.length*100:0,rev:sum(d,'val'),col:sum(p,'amt'),acc:q.filter(x=>x.st==='Accepted').length}}
const pct=(c,p,inv)=>{if(!p)return c?'<span class="up">new</span>':'<span>–</span>';const v=(c-p)/p*100,good=inv?v<=0:v>=0;return `<span class="${good?'up':'dn'}">${v>=0?'▲':'▼'} ${Math.abs(v).toFixed(1)}%</span>`};
const lgd=se=>'<div class="lgd">'+se.map(x=>`<span><i class="s" style="background:${x.c}"></i>${x.n}</span>`).join('')+'</div>';
function axes(lb,mx,W,H,p,X){let g='';for(let i=0;i<=3;i++){const y=H-22-(i/3)*(H-40);g+=`<line x1="${p}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--bd)"/><text x="${p-4}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--mu)">${fk(mx*i/3)}</text>`}
 const st=Math.ceil(lb.length/7);lb.forEach((d,i)=>{if(i%st==0)g+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--mu)">${d.length>9?d.slice(5):d}</text>`});return g}
function line(lb,se){const W=560,H=190,p=34,mx=Math.max(1,...se.flatMap(x=>x.v)),X=i=>p+(lb.length<2?0:i*(W-p-8)/(lb.length-1)),Y=v=>H-22-v/mx*(H-40);let g=axes(lb,mx,W,H,p,X);
 se.forEach(x=>{g+=`<polyline fill="none" stroke="${x.c}" stroke-width="2" points="${x.v.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`+x.v.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${x.c}"><title>${lb[i]} ${x.n}: ${v}</title></circle>`).join('')});return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`+lgd(se)}
function bars(lb,se){const W=560,H=190,p=34,mx=Math.max(1,...se.flatMap(x=>x.v)),sl=(W-p-8)/lb.length,bw=Math.max(1.5,sl*.8/se.length),X=i=>p+sl*(i+.5),Y=v=>H-22-v/mx*(H-40);let g=axes(lb,mx,W,H,p,X);
 se.forEach((x,j)=>x.v.forEach((v,i)=>g+=`<rect x="${p+sl*i+sl*.1+j*bw}" y="${Y(v)}" width="${bw}" height="${H-22-Y(v)}" fill="${x.c}" rx="1"><title>${lb[i]} ${x.n}: ${x.f?x.f(v):v}</title></rect>`));return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`+lgd(se)}
function donut(it,c){const t=it.reduce((a,b)=>a+b.v,0)||1,C=251.3;let o=0;const a=it.map(x=>{const l=x.v/t*C,e=`<circle r="40" cx="60" cy="60" fill="none" stroke="${x.c}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"><title>${x.n}: ${x.v}</title></circle>`;o+=l;return e}).join('');
 return `<div class="dnw"><svg viewBox="0 0 120 120"><circle r="40" cx="60" cy="60" fill="none" stroke="var(--bd)" stroke-width="16"/>${a}<text x="60" y="64" text-anchor="middle" font-size="16" font-weight="700" fill="var(--tx)">${c}</text></svg><div style="flex:1;min-width:140px">${it.map(x=>`<div class="lg"><i class="s" style="background:${x.c}"></i>${x.n}<b>${x.v} (${(x.v/t*100).toFixed(1)}%)</b></div>`).join('')}</div></div>`}
function hb(it,c,fmt=inr){const mx=Math.max(1,...it.map(x=>x.v));return it.length?it.map(x=>`<div class="h"><span title="${x.n}">${x.n}</span><span class="t"><b style="width:${x.v/mx*100}%;background:${x.c||c}"></b></span><b>${fmt(x.v)}${x.x?` <small style="color:var(--mu)">${x.x}</small>`:''}</b></div>`).join(''):'<p class="sub">No data in this range</p>'}
const tb=(h,r)=>`<div class="w"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.join('')||`<tr><td colspan="${h.length}" class="sub">No data in this range</td></tr>`}</table></div>`;
const card=(t,b)=>`<div class="c"><h3>${t}</h3>${b}</div>`;
const COL=['var(--pr)','var(--g)','var(--o)','var(--p)','var(--cy)','var(--r)','#64748b'];
// ---------- render ----------
function render(){const r=rg(),c=M(r.from,r.to),p=M(r.pf,r.pt),days=dates(r.from,r.to);
 $('cmp').textContent=`Showing ${r.from} to ${r.to} vs previous period (${r.pf} to ${r.pt}).`;
 const K=(l,v,pv,inv,f=x=>x)=>`<div class="c kp"><div class="l">${l}</div><div class="v">${f(v)}</div><div class="d">${pct(v,pv,inv)} vs previous ${r.len} day${r.len>1?'s':''}</div></div>`;
 $('kpi').innerHTML=K('New Leads',c.n,p.n)+K('Qualified Leads',c.qual,p.qual)+K('Converted Leads',c.conv,p.conv)+K('Unqualified Leads',c.unq,p.unq,1)+K('Conversion Rate',c.cr,p.cr,0,x=>x.toFixed(1)+'%')+K('Quotations Created',c.q.length,p.q.length)+K('Deals Created',c.d.length,p.d.length)+K('Deal Revenue',c.rev,p.rev,0,inr);
 const cnt=(A,d)=>A.filter(x=>x.date===d).length,fn=[{n:'New Leads',v:c.n,c:'var(--pr)'},{n:'Qualified',v:c.qual,c:'var(--g)'},{n:'Converted',v:c.conv,c:'var(--o)'}];
 const sc=Object.entries(gb(c.l,x=>x.src)).map(([n,a],i)=>({n,v:a.length,c:COL[i]}));
 $('lead').innerHTML=card('Lead Funnel',fn.map((x,i)=>`<div style="margin:6px auto;width:${Math.max(30,100-i*25)}%;background:${x.c};color:#fff;text-align:center;border-radius:6px;padding:8px">${x.n}: <b>${x.v}</b> (${c.n?(x.v/c.n*100).toFixed(1):0}%)</div>`).join('')+`<div style="text-align:center;margin-top:8px" class="sub">Unqualified: ${c.unq} (${c.n?(c.unq/c.n*100).toFixed(1):0}%)</div>`)
  +card('Daily Lead Trend (status)',line(days,[{n:'New Leads',c:'var(--pr)',v:days.map(d=>cnt(c.l,d))},{n:'Qualified',c:'var(--g)',v:days.map(d=>c.l.filter(x=>x.date===d&&x.st!=='Unqualified').length)},{n:'Converted',c:'var(--o)',v:days.map(d=>c.l.filter(x=>x.date===d&&x.st==='Converted').length)}]))
  +card('Lead Sources',donut(sc,c.n)+'<div class="sub" style="margin-top:8px">Source trend (daily)</div>'+line(days,sc.map(x=>({n:x.n,c:x.c,v:days.map(d=>c.l.filter(y=>y.date===d&&y.src===x.n).length)}))));
 // quotations
 const qs=SV.map((n,i)=>{const a=c.q.filter(x=>x.svc===n),ac=a.filter(x=>x.st==='Accepted').length;return{n,a,v:a.length,amt:sum(a,'amt'),ac,pe:a.filter(x=>x.st==='Pending').length,rj:a.filter(x=>x.st==='Rejected').length,c:COL[i]}});
 $('quo').innerHTML=card('Quotations by Service',bars(qs.map(x=>x.n.slice(0,8)),[{n:'Quotations',c:'var(--pr)',v:qs.map(x=>x.v)}]))
  +card('Quotation Value by Service',hb(qs.filter(x=>x.v).sort((a,b)=>b.amt-a.amt).map(x=>({n:x.n,v:x.amt})),'var(--cy)'))
  +card('Quote to Deal Conversion',donut([{n:'Accepted (deal)',v:c.acc,c:'var(--g)'},{n:'Pending',v:c.q.filter(x=>x.st==='Pending').length,c:'var(--o)'},{n:'Rejected',v:c.q.filter(x=>x.st==='Rejected').length,c:'var(--r)'}],(c.q.length?c.acc/c.q.length*100:0).toFixed(1)+'%')+`<p class="sub">${c.acc} accepted / ${c.q.length} quotations ${pct(c.q.length?c.acc/c.q.length:0,p.q.length?p.acc/p.q.length:0)}</p>`)
  +`<div class="c" style="grid-column:1/-1"><h3>Service-wise Quotation Details (click row)</h3>${tb(['Service','Quotations','Quoted Amount','Accepted','Pending','Rejected','Conv. Rate'],qs.map(x=>`<tr class="cl" onclick="svc('${x.n}')"><td>${x.n}</td><td>${x.v}</td><td>${inr(x.amt)}</td><td>${x.ac}</td><td>${x.pe}</td><td>${x.rj}</td><td>${x.v?(x.ac/x.v*100).toFixed(1):0}%</td></tr>`))}</div>`;
 // deals
 const ds=SV.map((n,i)=>{const a=c.d.filter(x=>x.svc===n);return{n,v:sum(a,'val'),x:a.length+' deals',c:COL[i]}}).filter(x=>x.v).sort((a,b)=>b.v-a.v);
 const cat=Object.entries(gb(c.d,x=>CAT[x.svc])).map(([n,a])=>({n,v:sum(a,'val'),x:a.length+' deals'})).sort((a,b)=>b.v-a.v);
 const pri=['High','Medium','Low'].map((n,i)=>{const a=c.d.filter(x=>x.pri===n);return{n,d:a.length,v:sum(a,'val'),c:['var(--r)','var(--o)','var(--g)'][i]}});
 const stg=['Docs Pending','Processing','Filing','Completed'].map((n,i)=>({n,v:c.d.filter(x=>x.stage===n).length,c:COL[i]}));
 $('dea').innerHTML=card('Deals &amp; Revenue by Service',hb(ds,'var(--pr)'))+card('Revenue by Category',hb(cat,'var(--p)'))
  +card('Priority Breakdown',tb(['Priority','Deals','Revenue','%'],pri.map(x=>`<tr><td><i class="s" style="background:${x.c}"></i>${x.n}</td><td>${x.d}</td><td>${inr(x.v)}</td><td>${c.rev?(x.v/c.rev*100).toFixed(1):0}%</td></tr>`)))
  +card('Daily Revenue Trend',bars(days,[{n:'Revenue',c:'var(--pr)',v:days.map(d=>sum(c.d.filter(x=>x.date===d),'val')),f:inr},{n:'Collected',c:'var(--g)',v:days.map(d=>sum(c.p.filter(x=>x.date===d),'amt')),f:inr}]))
  +card('Total vs Collected Revenue',`<div class="pill" style="background:#2563eb22"><small>Total Deal Value</small><div class="big">${inr(c.rev)}</div>${pct(c.rev,p.rev)}</div><div class="pill" style="background:#16a34a22"><small>Collected Revenue</small><div class="big">${inr(c.col)}</div>${pct(c.col,p.col)}</div><div class="pill" style="background:#dc262622"><small>Outstanding (deal value &minus; collected on these deals)</small><div class="big">${inr(sum(c.d,'val')-sum(c.d,'col'))}</div></div>`)
  +card('Deal Progress',hb(stg,'',x=>x)+tb(['Deal','Service','Value','Collected','Stage'],c.d.slice(-6).reverse().map(x=>`<tr class="cl" onclick="deal('${x.id}')"><td>${x.id}</td><td>${x.svc}</td><td>${inr(x.val)}</td><td>${Math.round(x.col/x.val*100)}%</td><td>${x.stage}</td></tr>`)));
 // orders
 const os=['Pending','In Progress','Completed','On Hold'].map((n,i)=>({n,v:c.o.filter(x=>x.st===n).length,c:['var(--o)','var(--pr)','var(--g)','var(--r)'][i]}));
 const op=SV.map(n=>{const a=c.o.filter(x=>x.svc===n);return{n,v:a.length?sum(a,'pg')/a.length:0,x:a.length+' orders'}}).filter(x=>x.x!=='0 orders');
 $('ord').innerHTML=card('Order Status',donut(os,c.o.length)+`<p class="sub">Completed orders: <b>${os[2].v}</b> ${pct(os[2].v,M(r.pf,r.pt).o.filter(x=>x.st==='Completed').length)}</p>`)
  +card('Order Progress by Service',hb(op,'var(--g)',x=>x.toFixed(0)+'%'))
  +card('Collection Trend',line(days,[{n:'Collected',c:'var(--g)',v:days.map(d=>sum(c.p.filter(x=>x.date===d),'amt'))}]))
  +`<div class="c" style="grid-column:1/-1"><h3>Payment History</h3>${tb(['Payment','Date','Deal','Mode','Amount'],c.p.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(x=>`<tr class="cl" onclick="deal('${x.deal}')"><td>${x.id}</td><td>${x.date}</td><td>${x.deal}</td><td>${x.mode}</td><td>${inr(x.amt)}</td></tr>`))}</div>`;
 lx()}
function lx(){const r=rg(),q=$('q').value.toLowerCase(),st=$('ss').value;
 const a=L.filter(x=>inR(x.date,r.from,r.to)&&(!st||x.st===st)&&(x.id+x.name).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));
 $('lx').innerHTML=tb(['Lead','Company','Date','Source','Status','Owner','Quotes','Deals','Deal Value'],a.slice(0,15).map(x=>`<tr class="cl" onclick="lead('${x.id}')"><td>${x.id}</td><td>${x.name}</td><td>${x.date}</td><td>${x.src}</td><td><span class="tag">${x.st}</span></td><td>${x.own}</td><td>${Q.filter(y=>y.lead===x.id).length}</td><td>${Dl.filter(y=>y.lead===x.id).length}</td><td>${inr(sum(Dl.filter(y=>y.lead===x.id),'val'))}</td></tr>`))+`<p class="sub">Showing ${Math.min(15,a.length)} of ${a.length}</p>`}

 open(`<h3 style="font-size:18px">Deal ${d.id} · ${d.svc}</h3><p class="sub">Lead <a href="#" onclick="lead('${d.lead}');return false">${d.lead}</a> · Quote ${d.q} · ${d.pri} priority · ${d.stage}</p><p>Value <b>${inr(d.val)}</b> · Collected <b>${inr(d.col)}</b> · Outstanding <b>${inr(d.val-d.col)}</b></p><h3>Orders (${o.length})</h3>`+tb(['Order','Date','Status','Progress'],o.map(x=>`<tr><td>${x.id}</td><td>${x.date}</td><td>${x.st}</td><td>${x.pg}%</td></tr>`))+`<h3 style="margin-top:14px">Payments (${p.length})</h3>`+tb(['Payment','Date','Mode','Amount'],p.map(x=>`<tr><td>${x.id}</td><td>${x.date}</td><td>${x.mode}</td><td>${inr(x.amt)}</td></tr>`)))}
